# libabigail suppressions for tools/abi_check.sh.
#
# The library exports a weak copy of every standard library template it instantiates
# in its .cpp files, e.g. std::make_shared<MCAPRingSink::Pimpl>. Each binary emits its
# own copy, so a change of such a copy (a Pimpl that grew) is not part of the ABI.
[suppress_function]
  name_regexp = ^(std|__gnu_cxx)::
